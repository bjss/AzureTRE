---
name: Deploy Azure TRE (branch)

# This workflow is intended to be used to test workflow changes that wouldn't be
# tested when running a PR via the comment bot
# Note that the branch must be in the main repo as secrets are not passed
# to workflows run from forks

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      e2eTestsCustomSelector:
        description: A pytest marker selector for the e2e tests to be run
        type: string
        default: ""
        required: false
      environment:
        description: The environment to run this workflow in
        type: environment
        default: CICD
        required: true
      e2eProcesses:
        description: The number of E2E processes/tests running in parallel
        type: string
        default: "1"
        required: false
      acceptNexusEula:
        description: Accept the Sonatype Nexus Community Edition EULA for the Linux VM test
        type: boolean
        default: false
        required: false
      skipDeployment:
        description: Run tests against an existing environment whose deployment matches this branch
        type: boolean
        default: false
        required: false

# The reusable deployment workflow holds the shared reference queue.
# Separate caller queues can discard deployments before they reach that group.

permissions:
  contents: read

jobs:
  prepare-not-main:
    name: Preparation
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    if: |
      github.ref != 'refs/heads/main'
    outputs:
      deployment: ${{ steps.run-id.outputs.deployment }}
      refid: ${{ steps.run-id.outputs.refid }}
    permissions:
      contents: read
    env:
      CI_NAMESPACE: ${{ secrets.CI_NAMESPACE }}
      CI_LOCATION: ${{ secrets.LOCATION || (secrets.CI_NAMESPACE == '' && vars.LOCATION) || '' }}
      CI_AZURE_ENVIRONMENT: ${{ secrets.AZURE_ENVIRONMENT || (secrets.CI_NAMESPACE == '' && vars.AZURE_ENVIRONMENT) || 'AzureCloud' }}
      CI_DEPLOYMENTS_ENABLED: ${{ secrets.CI_DEPLOYMENTS_ENABLED }}
      CI_CLEANUP_ENABLED: ${{ secrets.CI_CLEANUP_ENABLED }}
      CI_MAIN_ENABLED: ${{ secrets.CI_MAIN_ENABLED }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Read CI activation settings
        id: run-id
        env:
          CI_GIT_REF: ${{ github.ref }}
        run: python3 devops/scripts/ci_repository_scope.py prepare --purpose deployment

  run-deploy-tre-not-main:
    name: "Deploy PR"
    if: ${{ github.ref != 'refs/heads/main' && needs.prepare-not-main.outputs.deployment == 'allowed' }}
    needs: [prepare-not-main]
    uses: ./.github/workflows/deploy_tre_reusable.yml
    permissions:
      id-token: write
      checks: write
      contents: read
      pull-requests: write
      actions: read # Required by the reusable management job
    with:
      ciGitRef: ${{ github.ref }}
      ciEnvironmentId: ${{ needs.prepare-not-main.outputs.refid }}
      prHeadSha: ${{ github.sha }}
      e2eTestsCustomSelector: ${{ github.event.inputs.e2eTestsCustomSelector }}
      acceptNexusEula: ${{ inputs.acceptNexusEula }}
      skipDeployment: ${{ inputs.skipDeployment }}
      environmentName: ${{ github.event.inputs.environment }}
      E2E_TESTS_NUMBER_PROCESSES: ${{ fromJSON(github.event.inputs.e2eProcesses) }}
      DEVCONTAINER_TAG: ${{ needs.prepare-not-main.outputs.refid }}
    secrets:
      CI_NAMESPACE: ${{ secrets.CI_NAMESPACE }}
      CI_DEPLOYMENTS_ENABLED: ${{ secrets.CI_DEPLOYMENTS_ENABLED }}
      CI_CLEANUP_ENABLED: ${{ secrets.CI_CLEANUP_ENABLED }}
      CI_MAIN_ENABLED: ${{ secrets.CI_MAIN_ENABLED }}
      LOCATION: ${{ secrets.LOCATION }}
      AZURE_ENVIRONMENT: ${{ secrets.AZURE_ENVIRONMENT }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AAD_TENANT_ID: ${{ secrets.AAD_TENANT_ID }}
      ACR_NAME: ${{ format('tre{0}', needs.prepare-not-main.outputs.refid) }}
      API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
      API_CLIENT_SECRET: ${{ secrets.API_CLIENT_SECRET }}
      APPLICATION_ADMIN_CLIENT_ID: ${{ secrets.APPLICATION_ADMIN_CLIENT_ID }}
      APPLICATION_ADMIN_CLIENT_SECRET: ${{ secrets.APPLICATION_ADMIN_CLIENT_SECRET }}
      MGMT_RESOURCE_GROUP_NAME: ${{ format('rg-tre{0}-mgmt', needs.prepare-not-main.outputs.refid) }}
      MGMT_STORAGE_ACCOUNT_NAME: ${{ format('tre{0}mgmt', needs.prepare-not-main.outputs.refid) }}
      SWAGGER_UI_CLIENT_ID: ${{ secrets.SWAGGER_UI_CLIENT_ID }}
      TEST_APP_ID: ${{ secrets.TEST_APP_ID }}
      TEST_WORKSPACE_APP_ID: ${{ secrets.TEST_WORKSPACE_APP_ID }}
      TEST_WORKSPACE_APP_SECRET: ${{ secrets.TEST_WORKSPACE_APP_SECRET }}
      TEST_ACCOUNT_CLIENT_ID: "${{ secrets.TEST_ACCOUNT_CLIENT_ID }}"
      TEST_ACCOUNT_CLIENT_SECRET: "${{ secrets.TEST_ACCOUNT_CLIENT_SECRET }}"
      TRE_ID: ${{ format('tre{0}', needs.prepare-not-main.outputs.refid) }}
      CI_CACHE_ACR_NAME: ${{ secrets.ACR_NAME }}
      ENCRYPTION_KV_NAME: ${{ format('tre{0}mgmt', needs.prepare-not-main.outputs.refid) }}
      EXTERNAL_KEY_STORE_ID: ${{ secrets.EXTERNAL_KEY_STORE_ID }}
      PRIVATE_AGENT_SUBNET_ID: ${{ secrets.PRIVATE_AGENT_SUBNET_ID }}
