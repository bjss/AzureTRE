---
name: Deploy Azure TRE Reusable

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      prRef:
        description: The git ref to checkout
        type: string
        required: false
      prHeadSha:
        description: >-
          For PR builds where GITHUB_REF isn't set to the PR (e.g. comment trigger),
          pass the PR's head SHA commit here
        type: string
        required: false
      ciGitRef:
        description: The git ref to use in annotations to associate a deployment with the code that triggered it
        type: string
        required: true
      ciEnvironmentId:
        description: Isolated CI environment ID derived from the Git reference, Azure cloud and location
        type: string
        required: false
        default: ""
      e2eTestsCustomSelector:
        description: The pytest marker selector for the e2e tests to be run
        type: string
        default: ""
        required: false
      acceptNexusEula:
        description: Explicit consent to the Nexus CE EULA when E2E tests create Nexus
        type: boolean
        default: false
        required: false
      environmentName:
        description: The name of the Github Action's environment this will deploy into
        type: string
        required: true
      E2E_TESTS_NUMBER_PROCESSES:
        description: ""
        type: number
        required: false
      DEVCONTAINER_TAG:
        description: ""
        type: string
        required: true
      UI_SITE_NAME:
        description: Change the header text in the TRE portal
        type: string
        default: ""
        required: false
      UI_FOOTER_TEXT:
        description: Change the footer text in the TRE portal
        type: string
        default: ""
        required: false
      skipDeployment:
        description: Skip deployment jobs and run only the requested E2E tests against an existing environment
        type: boolean
        default: false
        required: false
    secrets:
      CI_NAMESPACE:
        required: false
      CI_DEPLOYMENTS_ENABLED:
        required: false
      CI_CLEANUP_ENABLED:
        required: false
      CI_MAIN_ENABLED:
        required: false
      LOCATION:
        required: false
      AZURE_ENVIRONMENT:
        required: false
      AAD_TENANT_ID:
        description: ""
        required: true
      ACR_NAME:
        description: ""
        required: true
      API_CLIENT_ID:
        description: ""
        required: true
      API_CLIENT_SECRET:
        description: ""
        required: true
      APPLICATION_ADMIN_CLIENT_ID:
        description: ""
        required: true
      APPLICATION_ADMIN_CLIENT_SECRET:
        description: ""
        required: true
      MGMT_RESOURCE_GROUP_NAME:
        description: ""
        required: true
      MGMT_STORAGE_ACCOUNT_NAME:
        description: ""
        required: true
      SWAGGER_UI_CLIENT_ID:
        description: ""
        required: true
      TEST_APP_ID:
        description: ""
        required: true
      TEST_WORKSPACE_APP_ID:
        description: ""
        required: true
      TEST_WORKSPACE_APP_SECRET:
        description: ""
        required: true
      TEST_ACCOUNT_CLIENT_ID:
        description: ""
        required: true
      TEST_ACCOUNT_CLIENT_SECRET:
        description: ""
        required: true
      TRE_ID:
        description: ""
        required: true
      CI_CACHE_ACR_NAME:
        description: ""
        required: false
      AZURE_CLIENT_ID:
        description: ""
        required: true
      AZURE_TENANT_ID:
        description: ""
        required: true
      AZURE_SUBSCRIPTION_ID:
        description: ""
        required: true
      ENCRYPTION_KV_NAME:
        description: ""
        required: false
      EXTERNAL_KEY_STORE_ID:
        description: ""
        required: false
      PRIVATE_AGENT_SUBNET_ID:
        description: ""
        required: false

# This will prevent multiple runs of this entire workflow.
# We should NOT cancel in progress runs as that can destabilize the environment.
concurrency:
  group: deploy-${{ inputs.ciGitRef }}
  cancel-in-progress: false
  queue: max

env:
  CI_ENVIRONMENT_ID: ${{ inputs.ciEnvironmentId }}

jobs:
  ci_config:
    name: Resolve CI configuration
    runs-on: ubuntu-latest
    environment: ${{ inputs.environmentName }}
    permissions:
      contents: read
    outputs:
      deployment: ${{ steps.scope.outputs.deployment }}
    env:
      CI_NAMESPACE: ${{ secrets.CI_NAMESPACE }}
      CI_LOCATION: ${{ secrets.LOCATION || (secrets.CI_NAMESPACE == '' && vars.LOCATION) || '' }}
      CI_AZURE_ENVIRONMENT: ${{ secrets.AZURE_ENVIRONMENT || (secrets.CI_NAMESPACE == '' && vars.AZURE_ENVIRONMENT) || 'AzureCloud' }}
      CI_DEPLOYMENTS_ENABLED: ${{ secrets.CI_DEPLOYMENTS_ENABLED }}
      CI_CLEANUP_ENABLED: ${{ secrets.CI_CLEANUP_ENABLED }}
      CI_MAIN_ENABLED: ${{ secrets.CI_MAIN_ENABLED }}
    steps:
      - name: Checkout configuration code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Read CI activation settings
        id: scope
        env:
          CI_GIT_REF: ${{ inputs.ciGitRef }}
        run: python3 devops/scripts/ci_repository_scope.py prepare --purpose deployment

  deploy_management:
    needs: [ci_config]
    name: Deploy Management
    if: ${{ !inputs.skipDeployment && needs.ci_config.outputs.deployment == 'allowed' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      checks: write
      contents: read
      actions: read # For bootstrap lease recovery ownership checks
    environment: ${{ inputs.environmentName }}
    env:
      CI_NAMESPACE: ${{ secrets.CI_NAMESPACE }}
      CI_LOCATION: ${{ secrets.LOCATION || (secrets.CI_NAMESPACE == '' && vars.LOCATION) || '' }}
      CI_AZURE_ENVIRONMENT: ${{ secrets.AZURE_ENVIRONMENT || (secrets.CI_NAMESPACE == '' && vars.AZURE_ENVIRONMENT) || 'AzureCloud' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          # if the following values are missing (i.e. not triggered via comment workflow)
          # then the default checkout will apply
          ref: ${{ inputs.prRef }}

      - name: Resolve and mask CI names
        env:
          CI_GIT_REF: ${{ inputs.ciGitRef }}
        run: python3 devops/scripts/ci_repository_scope.py resolve

      - name: Show inputs
        run: |
          echo "Inputs"
          echo "======"
          echo "prRef       : ${{ inputs.prRef }}"
          echo "prRHeadSha  : ${{ inputs.prHeadSha }}"
          echo "ciGitRef    : ${{ inputs.ciGitRef }}"
          echo "environment : ${{ inputs.environmentName }}"

      - name: Check required values
        id: check_required_values
        # since this is a resuable workflow, required=true secrets will always have a value but it can be empty.
        run: |
          if [ "${{ secrets.AAD_TENANT_ID }}" == '' ]; then
            echo "Missing secret: AAD_TENANT_ID" && exit 1
          fi
          if [ "${{ env.CI_NAMESPACE == '' && secrets.ACR_NAME || env.CI_ACR_NAME }}" == '' ]; then
            echo "Missing secret: ACR_NAME" && exit 1
          fi
          if [ "${{ secrets.API_CLIENT_ID }}" == '' ]; then
            echo "Missing secret: API_CLIENT_ID" && exit 1
          fi
          if [ "${{ secrets.API_CLIENT_SECRET }}" == '' ]; then
            echo "Missing secret: API_CLIENT_SECRET" && exit 1
          fi
          if [ "${{ secrets.APPLICATION_ADMIN_CLIENT_ID }}" == '' ]; then
            echo "Missing secret: APPLICATION_ADMIN_CLIENT_ID" && exit 1
          fi
          if [ "${{ secrets.APPLICATION_ADMIN_CLIENT_SECRET }}" == '' ]; then
            echo "Missing secret: APPLICATION_ADMIN_CLIENT_SECRET" && exit 1
          fi
          if [ "${{ env.CI_NAMESPACE == '' && secrets.MGMT_RESOURCE_GROUP_NAME || env.CI_MGMT_RESOURCE_GROUP_NAME }}" == '' ]; then
            echo "Missing secret: MGMT_RESOURCE_GROUP_NAME" && exit 1
          fi
          if [ "${{ env.CI_NAMESPACE == '' && secrets.MGMT_STORAGE_ACCOUNT_NAME || env.CI_MGMT_STORAGE_ACCOUNT_NAME }}" == '' ]; then
            echo "Missing secret: MGMT_STORAGE_ACCOUNT_NAME" && exit 1
          fi
          if [ "${{ secrets.SWAGGER_UI_CLIENT_ID }}" == '' ]; then
            echo "Missing secret: SWAGGER_UI_CLIENT_ID" && exit 1
          fi
          if [ "${{ secrets.TEST_APP_ID }}" == '' ]; then
            echo "Missing secret: TEST_APP_ID" && exit 1
          fi
          if [ "${{ secrets.TEST_WORKSPACE_APP_ID }}" == '' ]; then
            echo "Missing secret: TEST_WORKSPACE_APP_ID" && exit 1
          fi
          if [ "${{ secrets.TEST_WORKSPACE_APP_SECRET }}" == '' ]; then
            echo "Missing secret: TEST_WORKSPACE_APP_SECRET" && exit 1
          fi
          if [ "${{ secrets.TEST_ACCOUNT_CLIENT_ID }}" == '' ]; then
            echo "Missing secret: TEST_ACCOUNT_CLIENT_ID" && exit 1
          fi
          if [ "${{ secrets.TEST_ACCOUNT_CLIENT_SECRET }}" == '' ]; then
            echo "Missing secret: TEST_ACCOUNT_CLIENT_SECRET" && exit 1
          fi
          if [ "${{ env.CI_NAMESPACE == '' && secrets.TRE_ID || env.CI_TRE_ID }}" == '' ]; then
            echo "Missing secret: TRE_ID" && exit 1
          fi
          if [ "${{ secrets.AZURE_CLIENT_ID }}" == '' ]; then
            echo "Missing secret: AZURE_CLIENT_ID" && exit 1
          fi
          if [ "${{ secrets.AZURE_TENANT_ID }}" == '' ]; then
            echo "Missing secret: AZURE_TENANT_ID" && exit 1
          fi
          if [ "${{ secrets.AZURE_SUBSCRIPTION_ID }}" == '' ]; then
            echo "Missing secret: AZURE_SUBSCRIPTION_ID" && exit 1
          fi

          if [ "${{ env.CI_NAMESPACE == '' && inputs.DEVCONTAINER_TAG || env.CI_DEVCONTAINER_TAG }}" == '' ]; then
            echo "Missing input: DEVCONTAINER_TAG" && exit 1
          fi

          if [ "${{ env.CI_LOCATION }}" == '' ]; then
            echo "Missing configuration: LOCATION" && exit 1
          fi

          if [ "${{ env.CI_NAMESPACE == '' && secrets.CI_CACHE_ACR_NAME || env.CI_ACR_NAME }}" == '' ]; then
            echo "CI_CACHE_ACR_NAME is not set. Please run the workflow on the main branch first." && exit 1
          fi

      - name: Report check status start
        if: inputs.prHeadSha != ''
        uses: LouisBrunner/checks-action@dfcbcf801bff1ea7f1414824fc28f2cd697b35da # v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ inputs.prHeadSha }}
          name: "Deploy PR / Run E2E Tests (Smoke)"
          status: "in_progress"
          details_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Set up Docker BuildKit
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ env.CI_AZURE_ENVIRONMENT }}

      - name: ACR Login
        id: ci_cache_acr_login
        # will fail if this is a new env which is expected
        continue-on-error: true
        run: az acr login --name "${{ env.CI_NAMESPACE == '' && secrets.CI_CACHE_ACR_NAME || env.CI_ACR_NAME }}"

      - name: Build new devcontainer
        env:
          DOCKER_BUILDKIT: 1
        run: |
          set -e

          USER_UID=$(id -u)
          USER_GID=$(id -g)
          acr_domain_suffix=$(az cloud show --query suffixes.acrLoginServerEndpoint --output tsv)
          CI_CACHE_ACR_URI=${{ env.CI_NAMESPACE == '' && secrets.CI_CACHE_ACR_NAME || env.CI_ACR_NAME }}${acr_domain_suffix}
          echo "CI_CACHE_ACR_URI=$CI_CACHE_ACR_URI" >> "$GITHUB_ENV"

          docker_cache=()
          if [ "${{ steps.ci_cache_acr_login.outcome }}" = "success" ]; then
            docker_cache+=(--cache-from "$CI_CACHE_ACR_URI/tredev:${{ env.CI_NAMESPACE == '' && inputs.DEVCONTAINER_TAG || env.CI_DEVCONTAINER_TAG }}")
            docker_cache+=(--cache-from "$CI_CACHE_ACR_URI/tredev:latest")
          fi

          docker build . "${docker_cache[@]}" \
            -t "tredev:${{ env.CI_NAMESPACE == '' && inputs.DEVCONTAINER_TAG || env.CI_DEVCONTAINER_TAG }}" -f ".devcontainer/Dockerfile" \
            --build-arg BUILDKIT_INLINE_CACHE=1 --build-arg USER_UID="${USER_UID}" --build-arg USER_GID="${USER_GID}"

          docker image tag tredev:"${{ env.CI_NAMESPACE == '' && inputs.DEVCONTAINER_TAG || env.CI_DEVCONTAINER_TAG }}" \
            "$CI_CACHE_ACR_URI/tredev:${{ env.CI_NAMESPACE == '' && inputs.DEVCONTAINER_TAG || env.CI_DEVCONTAINER_TAG }}"

      - name: Deploy management
        uses: ./.github/actions/devcontainer_run_command
        with:
          CI_GIT_REF: ${{ inputs.ciGitRef }}
          COMMAND: "make bootstrap mgmt-deploy"
          DEVCONTAINER_TAG: ${{ env.CI_NAMESPACE == '' && inputs.DEVCONTAINER_TAG || env.CI_DEVCONTAINER_TAG }}
          CI_CACHE_ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.CI_CACHE_ACR_NAME || env.CI_ACR_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENVIRONMENT: ${{ env.CI_AZURE_ENVIRONMENT }}
          TRE_ID: ${{ env.CI_NAMESPACE == '' && secrets.TRE_ID || env.CI_TRE_ID }}
          LOCATION: ${{ env.CI_LOCATION }}
          ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.ACR_NAME || env.CI_ACR_NAME }}
          TERRAFORM_STATE_CONTAINER_NAME: ${{ vars.TERRAFORM_STATE_CONTAINER_NAME }}
          MGMT_RESOURCE_GROUP_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_RESOURCE_GROUP_NAME || env.CI_MGMT_RESOURCE_GROUP_NAME }}
          MGMT_STORAGE_ACCOUNT_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_STORAGE_ACCOUNT_NAME || env.CI_MGMT_STORAGE_ACCOUNT_NAME }}
          ENABLE_CMK_ENCRYPTION: ${{ vars.ENABLE_CMK_ENCRYPTION }}
          ENCRYPTION_KV_NAME: ${{ env.CI_NAMESPACE == '' && secrets.ENCRYPTION_KV_NAME || env.CI_ENCRYPTION_KV_NAME }}
          EXTERNAL_KEY_STORE_ID: ${{ secrets.EXTERNAL_KEY_STORE_ID }}
          PRIVATE_AGENT_SUBNET_ID: ${{ secrets.PRIVATE_AGENT_SUBNET_ID }}

      - name: ACR Login
        # failure in the first attempt indicates a new ACR, so we need to try again after it's been created
        if: steps.ci_cache_acr_login.outcome != 'success'
        run: |
          # shellcheck disable=SC2034,SC2015,SC2125
          for i in {1..3}; do
            az acr login --name "${{ env.CI_NAMESPACE == '' && secrets.CI_CACHE_ACR_NAME || env.CI_ACR_NAME }}" && ec=0 && break || ec="$?" && sleep 10
          done
          if [ "$ec" != 0 ]; then
            echo "::error::Failed to login to ACR after 3 attempts. Make sure to run the pipleline on the main branch first."
          fi
          # shellcheck disable=SC2242
          (exit "$ec")

      - name: Push cached devcontainer
        run: docker image push ${{ env.CI_CACHE_ACR_URI }}/tredev:${{ env.CI_NAMESPACE == '' && inputs.DEVCONTAINER_TAG || env.CI_DEVCONTAINER_TAG }}

  build_core_images:
    # used to build images used by core infrastructure
    name: Build Core Docker Images
    runs-on: ubuntu-latest
    needs: [ci_config, deploy_management]
    environment: ${{ inputs.environmentName }}
    strategy:
      fail-fast: true
      matrix:
        target:
          [
            build-and-push-api,
            build-and-push-resource-processor,
            build-and-push-airlock-processor,
          ]

    env:
      CI_NAMESPACE: ${{ secrets.CI_NAMESPACE }}
      CI_LOCATION: ${{ secrets.LOCATION || (secrets.CI_NAMESPACE == '' && vars.LOCATION) || '' }}
      CI_AZURE_ENVIRONMENT: ${{ secrets.AZURE_ENVIRONMENT || (secrets.CI_NAMESPACE == '' && vars.AZURE_ENVIRONMENT) || 'AzureCloud' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          # if the following values are missing (i.e. not triggered via comment workflow)
          # then the default checkout will apply
          ref: ${{ inputs.prRef }}

      - name: Resolve and mask CI names
        env:
          CI_GIT_REF: ${{ inputs.ciGitRef }}
        run: python3 devops/scripts/ci_repository_scope.py resolve

      - name: Docker build
        uses: ./.github/actions/devcontainer_run_command
        with:
          MGMT_STORAGE_ACCOUNT_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_STORAGE_ACCOUNT_NAME || env.CI_MGMT_STORAGE_ACCOUNT_NAME }}
          MGMT_RESOURCE_GROUP_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_RESOURCE_GROUP_NAME || env.CI_MGMT_RESOURCE_GROUP_NAME }}
          TRE_ID: ${{ env.CI_NAMESPACE == '' && secrets.TRE_ID || env.CI_TRE_ID }}
          CI_GIT_REF: ${{ inputs.ciGitRef }}
          COMMAND: "make ${{ matrix.target }}"
          DEVCONTAINER_TAG: ${{ env.CI_NAMESPACE == '' && inputs.DEVCONTAINER_TAG || env.CI_DEVCONTAINER_TAG }}
          CI_CACHE_ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.CI_CACHE_ACR_NAME || env.CI_ACR_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENVIRONMENT: ${{ env.CI_AZURE_ENVIRONMENT }}
          ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.ACR_NAME || env.CI_ACR_NAME }}

  start_tre:
    name: Start TRE
    runs-on: ubuntu-latest
    needs: [ci_config, deploy_management]
    environment: ${{ inputs.environmentName }}
    env:
      CI_NAMESPACE: ${{ secrets.CI_NAMESPACE }}
      CI_LOCATION: ${{ secrets.LOCATION || (secrets.CI_NAMESPACE == '' && vars.LOCATION) || '' }}
      CI_AZURE_ENVIRONMENT: ${{ secrets.AZURE_ENVIRONMENT || (secrets.CI_NAMESPACE == '' && vars.AZURE_ENVIRONMENT) || 'AzureCloud' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          # if the following values are missing (i.e. not triggered via comment workflow)
          # then the default checkout will apply
          ref: ${{ inputs.prRef }}

      - name: Resolve and mask CI names
        env:
          CI_GIT_REF: ${{ inputs.ciGitRef }}
        run: python3 devops/scripts/ci_repository_scope.py resolve

      - name: Start TRE
        uses: ./.github/actions/devcontainer_run_command
        with:
          MGMT_STORAGE_ACCOUNT_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_STORAGE_ACCOUNT_NAME || env.CI_MGMT_STORAGE_ACCOUNT_NAME }}
          MGMT_RESOURCE_GROUP_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_RESOURCE_GROUP_NAME || env.CI_MGMT_RESOURCE_GROUP_NAME }}
          ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.ACR_NAME || env.CI_ACR_NAME }}
          CI_GIT_REF: ${{ inputs.ciGitRef }}
          COMMAND: "make tre-start"
          DEVCONTAINER_TAG: ${{ env.CI_NAMESPACE == '' && inputs.DEVCONTAINER_TAG || env.CI_DEVCONTAINER_TAG }}
          CI_CACHE_ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.CI_CACHE_ACR_NAME || env.CI_ACR_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENVIRONMENT: ${{ env.CI_AZURE_ENVIRONMENT }}
          TRE_ID: ${{ env.CI_NAMESPACE == '' && secrets.TRE_ID || env.CI_TRE_ID }}

  deploy_tre:
    name: Deploy TRE
    runs-on: ubuntu-latest
    needs: [ci_config, build_core_images, start_tre]
    environment: ${{ inputs.environmentName }}
    env:
      CI_NAMESPACE: ${{ secrets.CI_NAMESPACE }}
      CI_LOCATION: ${{ secrets.LOCATION || (secrets.CI_NAMESPACE == '' && vars.LOCATION) || '' }}
      CI_AZURE_ENVIRONMENT: ${{ secrets.AZURE_ENVIRONMENT || (secrets.CI_NAMESPACE == '' && vars.AZURE_ENVIRONMENT) || 'AzureCloud' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          # if the following values are missing (i.e. not triggered via comment workflow)
          # then the default checkout will apply
          ref: ${{ inputs.prRef }}

      - name: Resolve and mask CI names
        env:
          CI_GIT_REF: ${{ inputs.ciGitRef }}
        run: python3 devops/scripts/ci_repository_scope.py resolve

      - name: Deploy TRE Core
        uses: ./.github/actions/devcontainer_run_command
        with:
          CI_GIT_REF: ${{ inputs.ciGitRef }}
          COMMAND: "TF_VAR_ci_git_ref=${{ inputs.ciGitRef }} TF_LOG=${{ vars.TF_LOG }} make deploy-core"
          DEVCONTAINER_TAG: ${{ env.CI_NAMESPACE == '' && inputs.DEVCONTAINER_TAG || env.CI_DEVCONTAINER_TAG }}
          CI_CACHE_ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.CI_CACHE_ACR_NAME || env.CI_ACR_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENVIRONMENT: ${{ env.CI_AZURE_ENVIRONMENT }}
          API_CLIENT_ID: "${{ secrets.API_CLIENT_ID }}"
          AAD_TENANT_ID: "${{ secrets.AAD_TENANT_ID }}"
          TRE_ID: ${{ env.CI_NAMESPACE == '' && secrets.TRE_ID || env.CI_TRE_ID }}
          LOCATION: ${{ env.CI_LOCATION }}
          ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.ACR_NAME || env.CI_ACR_NAME }}
          TERRAFORM_STATE_CONTAINER_NAME: ${{ vars.TERRAFORM_STATE_CONTAINER_NAME }}
          MGMT_RESOURCE_GROUP_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_RESOURCE_GROUP_NAME || env.CI_MGMT_RESOURCE_GROUP_NAME }}
          MGMT_STORAGE_ACCOUNT_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_STORAGE_ACCOUNT_NAME || env.CI_MGMT_STORAGE_ACCOUNT_NAME }}
          CORE_ADDRESS_SPACE: ${{ vars.CORE_ADDRESS_SPACE }}
          TRE_ADDRESS_SPACE: ${{ vars.TRE_ADDRESS_SPACE }}
          ENABLE_SWAGGER: ${{ vars.ENABLE_SWAGGER }}
          SWAGGER_UI_CLIENT_ID: "${{ secrets.SWAGGER_UI_CLIENT_ID }}"
          API_CLIENT_SECRET: "${{ secrets.API_CLIENT_SECRET }}"
          APPLICATION_ADMIN_CLIENT_ID: "${{ secrets.APPLICATION_ADMIN_CLIENT_ID }}"
          APPLICATION_ADMIN_CLIENT_SECRET: "${{ secrets.APPLICATION_ADMIN_CLIENT_SECRET }}"
          STATEFUL_RESOURCES_LOCKED: "${{ github.ref == 'refs/heads/main' && inputs.prRef == '' && true || false }}"
          KV_PURGE_PROTECTION_ENABLED: ${{ vars.KV_PURGE_PROTECTION_ENABLED || true }}
          CORE_APP_SERVICE_PLAN_SKU: ${{ vars.CORE_APP_SERVICE_PLAN_SKU }}
          RESOURCE_PROCESSOR_VMSS_SKU: ${{ vars.RESOURCE_PROCESSOR_VMSS_SKU }}
          RESOURCE_PROCESSOR_NUMBER_PROCESSES_PER_INSTANCE: ${{ vars.RESOURCE_PROCESSOR_NUMBER_PROCESSES_PER_INSTANCE }}
          RP_BUNDLE_VALUES: ${{ vars.RP_BUNDLE_VALUES }}
          FIREWALL_SKU: ${{ vars.FIREWALL_SKU}}
          APP_GATEWAY_SKU: ${{ vars.APP_GATEWAY_SKU }}
          ENABLE_CMK_ENCRYPTION: ${{ vars.ENABLE_CMK_ENCRYPTION }}
          ENCRYPTION_KV_NAME: ${{ env.CI_NAMESPACE == '' && secrets.ENCRYPTION_KV_NAME || env.CI_ENCRYPTION_KV_NAME }}
          EXTERNAL_KEY_STORE_ID: ${{ secrets.EXTERNAL_KEY_STORE_ID }}
          USER_MANAGEMENT_ENABLED: ${{ vars.USER_MANAGEMENT_ENABLED }}
          PRIVATE_AGENT_SUBNET_ID: ${{ secrets.PRIVATE_AGENT_SUBNET_ID }}
          AUTO_GRANT_WORKSPACE_CONSENT: ${{ vars.AUTO_GRANT_WORKSPACE_CONSENT }}
