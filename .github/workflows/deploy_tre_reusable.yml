          TRE_ID: ${{ env.CI_NAMESPACE == '' && secrets.TRE_ID || env.CI_TRE_ID }}
          LOCATION: ${{ env.CI_LOCATION }}

      - name: State Store Migrations
        uses: ./.github/actions/devcontainer_run_command
        with:
          ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.ACR_NAME || env.CI_ACR_NAME }}
          CI_GIT_REF: ${{ inputs.ciGitRef }}
          COMMAND: "make db-migrate"
          DEVCONTAINER_TAG: ${{ env.CI_NAMESPACE == '' && inputs.DEVCONTAINER_TAG || env.CI_DEVCONTAINER_TAG }}
          CI_CACHE_ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.CI_CACHE_ACR_NAME || env.CI_ACR_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENVIRONMENT: ${{ env.CI_AZURE_ENVIRONMENT }}
          API_CLIENT_ID: "${{ secrets.API_CLIENT_ID }}"
          AAD_TENANT_ID: "${{ secrets.AAD_TENANT_ID }}"
          TEST_APP_ID: "${{ secrets.TEST_APP_ID }}"
          TEST_ACCOUNT_CLIENT_ID: "${{ secrets.TEST_ACCOUNT_CLIENT_ID }}"
          TEST_ACCOUNT_CLIENT_SECRET: "${{ secrets.TEST_ACCOUNT_CLIENT_SECRET }}"
          TRE_ID: ${{ env.CI_NAMESPACE == '' && secrets.TRE_ID || env.CI_TRE_ID }}
          LOCATION: ${{ env.CI_LOCATION }}
          TERRAFORM_STATE_CONTAINER_NAME: ${{ vars.TERRAFORM_STATE_CONTAINER_NAME }}
          MGMT_RESOURCE_GROUP_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_RESOURCE_GROUP_NAME || env.CI_MGMT_RESOURCE_GROUP_NAME }}
          MGMT_STORAGE_ACCOUNT_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_STORAGE_ACCOUNT_NAME || env.CI_MGMT_STORAGE_ACCOUNT_NAME }}

  deploy_ui:
    name: Deploy UI
    runs-on: ubuntu-latest
    needs: [ci_config, deploy_tre]
    environment: ${{ inputs.environmentName }}
    env:
      CI_NAMESPACE: ${{ secrets.CI_NAMESPACE }}
      CI_LOCATION: ${{ secrets.LOCATION || (secrets.CI_NAMESPACE == '' && vars.LOCATION) || '' }}
      CI_AZURE_ENVIRONMENT: ${{ secrets.AZURE_ENVIRONMENT || (secrets.CI_NAMESPACE == '' && vars.AZURE_ENVIRONMENT) || 'AzureCloud' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          # if the following values are missing (i.e. not triggered via comment workflow)
          # then the default checkout will apply
          ref: ${{ inputs.prRef }}
      - name: Resolve and mask CI names
        env:
          CI_GIT_REF: ${{ inputs.ciGitRef }}
        run: python3 devops/scripts/ci_repository_scope.py resolve

      - name: Deploy UI
        uses: ./.github/actions/devcontainer_run_command
        with:
          ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.ACR_NAME || env.CI_ACR_NAME }}
          CI_GIT_REF: ${{ inputs.ciGitRef }}
          COMMAND: "make build-and-deploy-ui"
          DEVCONTAINER_TAG: ${{ env.CI_NAMESPACE == '' && inputs.DEVCONTAINER_TAG || env.CI_DEVCONTAINER_TAG }}
          CI_CACHE_ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.CI_CACHE_ACR_NAME || env.CI_ACR_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENVIRONMENT: ${{ env.CI_AZURE_ENVIRONMENT }}
          API_CLIENT_ID: "${{ secrets.API_CLIENT_ID }}"
          AAD_TENANT_ID: "${{ secrets.AAD_TENANT_ID }}"
          TRE_ID: ${{ env.CI_NAMESPACE == '' && secrets.TRE_ID || env.CI_TRE_ID }}
          LOCATION: ${{ env.CI_LOCATION }}
          TERRAFORM_STATE_CONTAINER_NAME: ${{ vars.TERRAFORM_STATE_CONTAINER_NAME }}
          MGMT_RESOURCE_GROUP_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_RESOURCE_GROUP_NAME || env.CI_MGMT_RESOURCE_GROUP_NAME }}
          MGMT_STORAGE_ACCOUNT_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_STORAGE_ACCOUNT_NAME || env.CI_MGMT_STORAGE_ACCOUNT_NAME }}
          SWAGGER_UI_CLIENT_ID: "${{ secrets.SWAGGER_UI_CLIENT_ID }}"
          USER_MANAGEMENT_ENABLED: ${{ vars.USER_MANAGEMENT_ENABLED }}
          UI_SITE_NAME: "${{ inputs.UI_SITE_NAME || vars.UI_SITE_NAME }}"
          UI_FOOTER_TEXT: "${{ inputs.UI_FOOTER_TEXT || vars.UI_FOOTER_TEXT }}"

  e2e_tests_smoke:
    name: "Run E2E Tests (Smoke)"
    # When skipDeployment is true, the deploy jobs in needs are intentionally skipped.
    # always() lets this job still evaluate its guard and run against the existing PR environment.
    if: >-
      ${{ always() && needs.ci_config.result == 'success' && needs.ci_config.outputs.deployment == 'allowed' &&
      (inputs.skipDeployment || !contains(needs.*.result, 'skipped')) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environmentName }}
    needs: [ci_config, deploy_shared_services, register_bundles, deploy_ui]
    timeout-minutes: 10
    env:
      CI_NAMESPACE: ${{ secrets.CI_NAMESPACE }}
      CI_LOCATION: ${{ secrets.LOCATION || (secrets.CI_NAMESPACE == '' && vars.LOCATION) || '' }}
      CI_AZURE_ENVIRONMENT: ${{ secrets.AZURE_ENVIRONMENT || (secrets.CI_NAMESPACE == '' && vars.AZURE_ENVIRONMENT) || 'AzureCloud' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          # if the following values are missing (i.e. not triggered via comment workflow)
          # then the default checkout will apply
          ref: ${{ inputs.prRef }}

      - name: Resolve and mask CI names
        env:
          CI_GIT_REF: ${{ inputs.ciGitRef }}
        run: python3 devops/scripts/ci_repository_scope.py resolve

      - name: Run E2E Tests (Smoke)
        uses: ./.github/actions/devcontainer_run_command
        with:
          MGMT_STORAGE_ACCOUNT_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_STORAGE_ACCOUNT_NAME || env.CI_MGMT_STORAGE_ACCOUNT_NAME }}
          MGMT_RESOURCE_GROUP_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_RESOURCE_GROUP_NAME || env.CI_MGMT_RESOURCE_GROUP_NAME }}
          ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.ACR_NAME || env.CI_ACR_NAME }}
          CI_GIT_REF: ${{ inputs.ciGitRef }}
          COMMAND: "make test-e2e-smoke"
          DEVCONTAINER_TAG: ${{ env.CI_NAMESPACE == '' && inputs.DEVCONTAINER_TAG || env.CI_DEVCONTAINER_TAG }}
          CI_CACHE_ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.CI_CACHE_ACR_NAME || env.CI_ACR_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENVIRONMENT: ${{ env.CI_AZURE_ENVIRONMENT }}
          LOCATION: ${{ env.CI_LOCATION }}
          API_CLIENT_ID: "${{ secrets.API_CLIENT_ID }}"
          AAD_TENANT_ID: "${{ secrets.AAD_TENANT_ID }}"
          TEST_APP_ID: "${{ secrets.TEST_APP_ID }}"
          TEST_WORKSPACE_APP_ID: "${{ secrets.TEST_WORKSPACE_APP_ID }}"
          TEST_WORKSPACE_APP_SECRET: "${{ secrets.TEST_WORKSPACE_APP_SECRET }}"
          TEST_ACCOUNT_CLIENT_ID: "${{ secrets.TEST_ACCOUNT_CLIENT_ID }}"
          TEST_ACCOUNT_CLIENT_SECRET: "${{ secrets.TEST_ACCOUNT_CLIENT_SECRET }}"
          TRE_ID: ${{ env.CI_NAMESPACE == '' && secrets.TRE_ID || env.CI_TRE_ID }}
          IS_API_SECURED: false
          WORKSPACE_APP_SERVICE_PLAN_SKU: ${{ vars.WORKSPACE_APP_SERVICE_PLAN_SKU }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: E2E Test (Smoke) Results
          path: "./e2e_tests/pytest_e2e_smoke.xml"

  e2e_tests_custom:
    name: "Run E2E Tests"
    # Same as smoke tests: skipDeployment intentionally bypasses deploy jobs but still runs E2E tests.
    if: >-
      ${{ always() && needs.ci_config.result == 'success' && needs.ci_config.outputs.deployment == 'allowed' && inputs.e2eTestsCustomSelector != '' &&
      (inputs.skipDeployment || !contains(needs.*.result, 'skipped')) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environmentName }}
    needs:
      [ci_config, deploy_shared_services, register_bundles, register_user_resource_bundles]
    timeout-minutes: 300
    env:
      CI_NAMESPACE: ${{ secrets.CI_NAMESPACE }}
      CI_LOCATION: ${{ secrets.LOCATION || (secrets.CI_NAMESPACE == '' && vars.LOCATION) || '' }}
      CI_AZURE_ENVIRONMENT: ${{ secrets.AZURE_ENVIRONMENT || (secrets.CI_NAMESPACE == '' && vars.AZURE_ENVIRONMENT) || 'AzureCloud' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          # if the following values are missing (i.e. not triggered via comment workflow)
          # then the default checkout will apply
          ref: ${{ inputs.prRef }}

      - name: Resolve and mask CI names
        env:
          CI_GIT_REF: ${{ inputs.ciGitRef }}
        run: python3 devops/scripts/ci_repository_scope.py resolve

      - name: Run E2E Tests
        uses: ./.github/actions/devcontainer_run_command
        with:
          MGMT_STORAGE_ACCOUNT_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_STORAGE_ACCOUNT_NAME || env.CI_MGMT_STORAGE_ACCOUNT_NAME }}
          MGMT_RESOURCE_GROUP_NAME: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_RESOURCE_GROUP_NAME || env.CI_MGMT_RESOURCE_GROUP_NAME }}
          ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.ACR_NAME || env.CI_ACR_NAME }}
          CI_GIT_REF: ${{ inputs.ciGitRef }}
          COMMAND: "TEST_ACCEPT_NEXUS_EULA=${{ inputs.acceptNexusEula }} make test-e2e-custom SELECTOR='${{ inputs.e2eTestsCustomSelector }}'"
          DEVCONTAINER_TAG: ${{ env.CI_NAMESPACE == '' && inputs.DEVCONTAINER_TAG || env.CI_DEVCONTAINER_TAG }}
          CI_CACHE_ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.CI_CACHE_ACR_NAME || env.CI_ACR_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENVIRONMENT: ${{ env.CI_AZURE_ENVIRONMENT }}
          LOCATION: ${{ env.CI_LOCATION }}
          API_CLIENT_ID: "${{ secrets.API_CLIENT_ID }}"
          AAD_TENANT_ID: "${{ secrets.AAD_TENANT_ID }}"
          TEST_APP_ID: "${{ secrets.TEST_APP_ID }}"
          TEST_WORKSPACE_APP_ID: "${{ secrets.TEST_WORKSPACE_APP_ID }}"
          TEST_WORKSPACE_APP_SECRET: "${{ secrets.TEST_WORKSPACE_APP_SECRET }}"
          TEST_ACCOUNT_CLIENT_ID: "${{ secrets.TEST_ACCOUNT_CLIENT_ID }}"
          TEST_ACCOUNT_CLIENT_SECRET: "${{ secrets.TEST_ACCOUNT_CLIENT_SECRET }}"
          TRE_ID: ${{ env.CI_NAMESPACE == '' && secrets.TRE_ID || env.CI_TRE_ID }}
          IS_API_SECURED: false
          WORKSPACE_APP_SERVICE_PLAN_SKU: ${{ vars.WORKSPACE_APP_SERVICE_PLAN_SKU }}
          E2E_TESTS_NUMBER_PROCESSES: ${{ inputs.E2E_TESTS_NUMBER_PROCESSES }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: E2E Test Results
          path: "./e2e_tests/pytest_e2e_*.xml"

  summary:
    name: Summary
    needs: [ci_config, e2e_tests_smoke, e2e_tests_custom]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    if: always() && needs.ci_config.outputs.deployment == 'allowed'
    environment: ${{ inputs.environmentName }}
    env:
      CI_NAMESPACE: ${{ secrets.CI_NAMESPACE }}
      CI_LOCATION: ${{ secrets.LOCATION || (secrets.CI_NAMESPACE == '' && vars.LOCATION) || '' }}
      CI_AZURE_ENVIRONMENT: ${{ secrets.AZURE_ENVIRONMENT || (secrets.CI_NAMESPACE == '' && vars.AZURE_ENVIRONMENT) || 'AzureCloud' }}
    steps:
      - name: Checkout configuration code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Resolve and mask CI names
        env:
          CI_GIT_REF: ${{ inputs.ciGitRef }}
        run: python3 devops/scripts/ci_repository_scope.py resolve

      - uses: im-open/workflow-conclusion@fce18569e28a9f2ed1feca1e6d4251e6a7365fdc # v2.2.4
        id: conclusion
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # For PR builds triggered from comment builds, the GITHUB_REF is set to main
      # so the checks aren't automatically associated with the PR
      # If prHeadSha is specified then explicitly mark the checks for that SHA.
      # This still runs after skipDeployment builds because the summary job needs the E2E jobs,
      # not the skipped deploy jobs.
      - name: Report check status
        if: inputs.prHeadSha != ''
        uses: LouisBrunner/checks-action@dfcbcf801bff1ea7f1414824fc28f2cd697b35da # v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # the name must be identical to the one received by the real job
          sha: ${{ inputs.prHeadSha }}
          name: "Deploy PR / Run E2E Tests (Smoke)"
          status: "completed"
          conclusion: ${{ env.WORKFLOW_CONCLUSION }}
          details_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Publish E2E Test Results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        with:
          files: "artifacts/**/*.xml"
          check_name: "E2E Test Results"
          comment_mode: off
