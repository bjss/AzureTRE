---
name: Renew Lets Encrypt Certificates

on: # yamllint disable-line rule:truthy
  # schedule:
  #   # 3am each month https://crontab.guru/#0_3_1_*_*
  #   - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to run this workflow in
        type: environment
        default: CICD
        required: true

# This will prevent multiple runs of this entire workflow.
# We should NOT cancel in progress runs as that can destabilize the environment.
concurrency:
  group: deploy-refs/heads/main
  cancel-in-progress: false
  queue: max

permissions:
  id-token: write
  contents: read

env:
  USE_ENV_VARS_NOT_FILES: true
  TF_INPUT: 0 # interactive is off
  TF_IN_AUTOMATION: 1 # Run in headless mode

jobs:
  renew_letsencrypt_certs:
    name: Renew Lets Encrypt Certificates
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'CICD' }}
    env:
      CI_NAMESPACE: ${{ secrets.CI_NAMESPACE }}
      CI_LOCATION: ${{ secrets.LOCATION || (secrets.CI_NAMESPACE == '' && vars.LOCATION) || '' }}
      CI_AZURE_ENVIRONMENT: ${{ secrets.AZURE_ENVIRONMENT || (secrets.CI_NAMESPACE == '' && vars.AZURE_ENVIRONMENT) || 'AzureCloud' }}
      CI_DEPLOYMENTS_ENABLED: ${{ secrets.CI_DEPLOYMENTS_ENABLED }}
      CI_CLEANUP_ENABLED: ${{ secrets.CI_CLEANUP_ENABLED }}
      CI_MAIN_ENABLED: ${{ secrets.CI_MAIN_ENABLED }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Read CI activation settings
        id: scope
        env:
          CI_GIT_REF: refs/heads/main
        run: python3 devops/scripts/ci_repository_scope.py prepare --purpose deployment

      - name: Install specific Azure CLI version
        if: steps.scope.outputs.deployment == 'allowed'
        run: |
          AZ_DIST=$(lsb_release -cs)
          AZ_VER=2.81.0

          apt-cache policy azure-cli
          sudo apt-get install azure-cli="${AZ_VER}-1~${AZ_DIST}" --allow-downgrades
          az version

      - name: Install Terraform
        if: steps.scope.outputs.deployment == 'allowed'
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Azure Login
        if: steps.scope.outputs.deployment == 'allowed'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ env.CI_AZURE_ENVIRONMENT }}

      - name: Renew Certificates
        if: steps.scope.outputs.deployment == 'allowed'
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENVIRONMENT: ${{ env.CI_AZURE_ENVIRONMENT }}
          LOCATION: ${{ env.CI_LOCATION }}
          TF_VAR_ci_git_ref: refs/heads/main
          ACR_NAME: ${{ env.CI_NAMESPACE == '' && secrets.ACR_NAME || env.CI_ACR_NAME }}
          TRE_ID: ${{ env.CI_NAMESPACE == '' && secrets.TRE_ID || env.CI_TRE_ID }}
          TF_VAR_terraform_state_container_name: ${{ secrets.TERRAFORM_STATE_CONTAINER_NAME || 'tfstate' }}
          TF_VAR_mgmt_resource_group_name: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_RESOURCE_GROUP_NAME || env.CI_MGMT_RESOURCE_GROUP_NAME }}
          TF_VAR_mgmt_storage_account_name: ${{ env.CI_NAMESPACE == '' && secrets.MGMT_STORAGE_ACCOUNT_NAME || env.CI_MGMT_STORAGE_ACCOUNT_NAME }}
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
          PRIVATE_AGENT_SUBNET_ID: ${{ secrets.PRIVATE_AGENT_SUBNET_ID }}
        run: |
          sudo apt-get install -y python3 python3-venv libaugeas0 \
            && python3 -m venv /opt/certbot/ \
            && /opt/certbot/bin/pip install --upgrade pip \
            && /opt/certbot/bin/pip install certbot
          make letsencrypt
